<meta property="og:title" content="小草颂 LGM · LitleGras Music Club">
<meta property="og:description" content="理大工程系分院原创音乐团体 · 年度音乐创作演绎会">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="assets/css/style.css?v=202611270229">
</head>
<body>
<header id="site-header" class="site-header"></header>

<main>
  <section class="hero wrap" id="hero" aria-live="polite">
    <p class="giant">LGM<span style="color:var(--ink);text-shadow:none">.</span></p>
    <div id="hero-body" class="hero-grid"><div class="hero-main"><h1>……</h1></div></div>
  </section>

  <section class="tapes" aria-hidden="true">
    <div class="strip a"><div class="track" id="tape-a"></div></div>
    <div class="strip b"><div class="track rev" id="tape-b"></div></div>
  </section>

  <section class="block wrap">
    <div class="grid tilt" id="stats" style="--min:230px"></div>
  </section>

  <section class="block wrap">
    <div class="sec-title"><h2 data-i18n="sec.events"></h2><a href="events.html" style="font-weight:900" data-i18n="btn.allEvents"></a></div>
    <div class="grid tilt fill" id="events" style="--min:260px;gap:28px"></div>
  </section>

  <section class="block wrap" id="songs-block">
    <div class="sec-title"><h2 data-i18n="sec.songs"></h2><a href="music.html" style="font-weight:900" data-i18n="btn.allSongs"></a></div>
    <div class="sleeves" id="songs"></div>
  </section>

  <section class="block" id="partners-block">
    <div class="wrap sec-title"><h2 class="display" style="font-size:22px" data-i18n="sec.partners"></h2></div>
    <div class="logos"><div class="track" id="logos"></div></div>
  </section>

  <section class="block wrap" style="padding-bottom:100px">
    <div class="panel blue">
      <div style="flex:1 1 460px"><div class="big" data-i18n="cta.title"></div><p style="font-weight:700;font-size:18px;margin:14px 0 0" data-i18n="cta.body"></p></div>
      <a href="partners.html" class="btn yellow" style="--r:-3deg" data-i18n="cta.btn"></a>
    </div>
  </section>
</main>

<footer id="site-footer" class="site-footer"></footer>
