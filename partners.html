<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>赞助合作 · 小草颂 LGM</title>
<meta name="description" content="赞助小草颂 LGM 年度音乐创作演绎会：观众数据、曝光方式、赞助配套与联系方式。">
<meta property="og:title" content="赞助合作 · 小草颂 LGM">
<meta property="og:image" content="assets/img/logo.png">
<link rel="icon" href="assets/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&family=Archivo+Black&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<header id="site-header" class="site-header"></header>

<main>
  <section class="hero wrap" style="padding-bottom:64px">
    <p class="giant" style="font-size:clamp(56px,10vw,120px)">PRINT YOUR<br>LOGO HERE.</p>
    <div class="hero-grid" style="align-items:flex-end">
      <div class="hero-main">
        <div class="brush" style="font-size:clamp(34px,5vw,52px);line-height:1.25" data-i18n="p.hero.sub"></div>
        <p id="p-body"></p>
        <div class="btns" id="p-btns"></div>
      </div>
      <div style="width:170px;height:170px;flex:0 0 auto;animation:spin 14s linear infinite" id="p-stamp"></div>
    </div>
  </section>

  <section class="dark">
    <div class="wrap block">
      <div class="sec-title"><h2 data-i18n="p.who"></h2></div>
      <div class="grid tilt" id="stats" style="--min:230px"></div>
      <p style="margin-top:28px;font-size:17px;line-height:1.8;color:#CFCBC2;max-width:760px" data-i18n="p.who.body"></p>
    </div>
  </section>

  <section class="block wrap">
    <div class="sec-title"><h2 data-i18n="p.where"></h2></div>
    <div class="grid tilt" style="--min:250px">
      <div class="card"><div class="display" style="color:var(--pink)">01</div><div style="font-weight:900;font-size:20px" data-i18n="p.w1"></div><div class="muted" data-i18n="p.w1d"></div></div>
      <div class="card"><div class="display" style="color:var(--blue)">02</div><div style="font-weight:900;font-size:20px" data-i18n="p.w2"></div><div class="muted" data-i18n="p.w2d"></div></div>
      <div class="card"><div class="display">03</div><div style="font-weight:900;font-size:20px" data-i18n="p.w3"></div><div class="muted" data-i18n="p.w3d"></div></div>
      <div class="card"><div class="display" style="color:var(--pink)">04</div><div style="font-weight:900;font-size:20px" data-i18n="p.w4"></div><div class="muted" data-i18n="p.w4d"></div></div>
      <div class="card"><div class="display" style="color:var(--blue)">05</div><div style="font-weight:900;font-size:20px" data-i18n="p.w5"></div><div class="muted" data-i18n="p.w5d"></div></div>
      <div class="card"><div class="display">06</div><div style="font-weight:900;font-size:20px" data-i18n="p.w6"></div><div class="muted" data-i18n="p.w6d"></div></div>
    </div>
  </section>

  <section class="block wrap" id="packs-block">
    <div class="sec-title"><h2 class="display" style="font-size:clamp(40px,6vw,56px)" data-i18n="p.packs"></h2></div>
    <div class="grid tilt" id="packs" style="--min:290px;gap:32px;align-items:start"></div>
    <p style="margin-top:28px;font-weight:700" data-i18n="p.inkind"></p>
  </section>

  <section class="block wrap">
    <div class="sec-title"><h2 data-i18n="p.past"></h2></div>
    <div class="logo-wall" id="past"></div>
  </section>

  <section class="block wrap">
    <div class="sec-title"><h2 class="display" style="font-size:clamp(40px,6vw,56px)" data-i18n="p.how"></h2></div>
    <div class="grid" style="--min:220px;gap:16px">
      <div class="step"><b>1</b><div data-i18n="p.s1"></div></div>
      <div class="step"><b>2</b><div data-i18n="p.s2"></div></div>
      <div class="step"><b>3</b><div data-i18n="p.s3"></div></div>
      <div class="step"><b>4</b><div data-i18n="p.s4"></div></div>
    </div>
  </section>

  <section class="block wrap" style="padding-bottom:100px">
    <div class="panel yellow">
      <div style="flex:1 1 460px"><div class="big" data-i18n="p.talk"></div><p style="font-weight:700;font-size:18px;margin:12px 0 0" id="p-contact"></p></div>
      <div id="p-wa2"></div>
    </div>
  </section>
</main>

<footer id="site-footer" class="site-footer"></footer>

<script src="assets/js/config.js"></script>
<script src="assets/js/lgm.js"></script>
<script src="assets/js/strings.js"></script>
<script src="assets/js/partners.js"></script>
</body>
</html>
