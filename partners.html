<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>赞助合作 · 小草颂 LGM</title>
<meta name="description" content="赞助小草颂 LGM 第 27 届音乐创作演绎会《无限·无界 UNBOUND》：观众数据、赞助配套、广告与实物赞助、联系方式。">
<meta property="og:title" content="赞助合作 · 小草颂 LGM">
<meta property="og:image" content="assets/img/logo.png">
<link rel="icon" href="assets/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&family=Archivo+Black&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=202611270229">
</head>
<body>
<header id="site-header" class="site-header"></header>

<main>
  <section class="hero wrap" style="padding-bottom:56px">
    <p class="page-giant">PRINT YOUR<br>LOGO HERE.</p>
    <div class="hero-grid" style="align-items:flex-end">
      <div class="hero-main">
        <div class="lead" data-i18n="p.hero.sub"></div>
        <div class="facts" id="p-facts"></div>
        <div class="btns" id="p-btns"></div>
      </div>
      <div style="width:170px;height:170px;flex:0 0 auto;animation:spin 14s linear infinite" id="p-stamp"></div>
    </div>
  </section>

  <section class="block wrap" id="theme-block">
    <div class="panel" style="background:#fff;display:block">
      <div class="display" style="color:var(--pink)" data-i18n="p.theme"></div>
      <div id="theme-title" style="margin-top:8px"></div>
      <div id="theme-desc" style="margin-top:16px;font-size:17px;line-height:1.9;max-width:820px"></div>
    </div>
  </section>

  <section class="dark">
    <div class="wrap block">
      <div class="sec-title"><h2 data-i18n="p.who"></h2></div>
      <div class="grid tilt" id="stats" style="--min:210px"></div>
      <div style="display:flex;flex-wrap:wrap;gap:40px;margin-top:48px">
        <div style="flex:1 1 420px">
          <p style="font-weight:900;font-size:18px;margin:0 0 14px" id="target"></p>
          <ul class="list" id="audience"></ul>
        </div>
        <div style="flex:1 1 360px">
          <p style="font-weight:900;font-size:18px;margin:0 0 14px" data-i18n="p.media"></p>
          <div class="media-chips" id="media"></div>
        </div>
      </div>
    </div>
  </section>

  <section class="block wrap">
    <div class="sec-title"><h2 data-i18n="p.why"></h2></div>
    <div class="grid tilt" style="--min:210px">
      <div class="card"><div class="display" style="color:var(--pink)">01</div><div style="font-weight:900;font-size:19px" data-i18n="p.b1"></div><p class="muted" style="margin:6px 0 0;line-height:1.6" data-i18n="p.b1d"></p></div>
      <div class="card"><div class="display" style="color:var(--blue)">02</div><div style="font-weight:900;font-size:19px" data-i18n="p.b2"></div><p class="muted" style="margin:6px 0 0;line-height:1.6" data-i18n="p.b2d"></p></div>
      <div class="card"><div class="display">03</div><div style="font-weight:900;font-size:19px" data-i18n="p.b3"></div><p class="muted" style="margin:6px 0 0;line-height:1.6" data-i18n="p.b3d"></p></div>
      <div class="card"><div class="display" style="color:var(--pink)">04</div><div style="font-weight:900;font-size:19px" data-i18n="p.b4"></div><p class="muted" style="margin:6px 0 0;line-height:1.6" data-i18n="p.b4d"></p></div>
      <div class="card"><div class="display" style="color:var(--blue)">05</div><div style="font-weight:900;font-size:19px" data-i18n="p.b5"></div><p class="muted" style="margin:6px 0 0;line-height:1.6" data-i18n="p.b5d"></p></div>
    </div>
  </section>

  <section class="block wrap" id="packs-block">
    <div class="sec-title"><h2 class="display" style="font-size:clamp(40px,6vw,56px)" data-i18n="p.packs"></h2></div>
    <div class="grid tilt" id="packs" style="--min:220px;gap:30px;align-items:start"></div>
    <h3 style="font-family:var(--brush);font-weight:400;font-size:36px;margin:64px 0 18px" data-i18n="p.compare"></h3>
    <div class="scroll"><table class="zine" id="compare"></table></div>
  </section>

  <section class="block wrap">
    <div style="display:flex;flex-wrap:wrap;gap:40px;align-items:flex-start">
      <div style="flex:1 1 340px" id="ads-block">
        <div class="sec-title"><h2 data-i18n="p.ads"></h2></div>
        <table class="zine small" id="ads"></table>
      </div>
      <div style="flex:2 1 520px;min-width:0" id="other-block">
        <div class="sec-title"><h2 data-i18n="p.other"></h2></div>
        <div class="grid tilt" id="other" style="--min:240px"></div>
      </div>
    </div>
    <p style="margin-top:28px;font-weight:900;font-size:18px" data-i18n="p.custom"></p>
  </section>

  <section class="block past-block">
    <div class="wrap sec-title"><h2 data-i18n="p.past"></h2></div>
    <div id="past"></div>
  </section>

  <section class="block wrap">
    <div class="sec-title"><h2 class="display" style="font-size:clamp(40px,6vw,56px)" data-i18n="p.how"></h2></div>
    <div class="grid" style="--min:200px;gap:16px">
      <div class="step"><b>1</b><div data-i18n="p.s1"></div></div>
      <div class="step"><b>2</b><div data-i18n="p.s2"></div></div>
      <div class="step"><b>3</b><div data-i18n="p.s3"></div></div>
      <div class="step"><b>4</b><div data-i18n="p.s4"></div></div>
    </div>
  </section>

  <section class="block wrap" id="tc-block">
    <div class="sec-title"><h2 data-i18n="p.tc"></h2></div>
    <div id="tc"></div>
  </section>

  <section class="block wrap" style="padding-bottom:100px">
    <div class="panel yellow">
      <div style="flex:1 1 460px"><div class="big" data-i18n="p.talk"></div><div style="font-weight:700;font-size:18px;margin-top:14px;line-height:1.8" id="p-contact"></div></div>
      <div id="p-wa2"></div>
    </div>
  </section>
</main>

<footer id="site-footer" class="site-footer"></footer>

<script src="assets/js/config.js?v=202611270229"></script>
<script src="assets/js/lgm.js?v=202611270229"></script>
<script src="assets/js/strings.js?v=202611270229"></script>
<script src="assets/js/partners.js?v=202611270229"></script>
</body>
</html>
