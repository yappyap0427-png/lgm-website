<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>历届 · 小草颂 LGM</title>
<meta name="description" content="小草颂 LGM 二十多年来的音乐会、得奖与每一位小草。">
<meta property="og:title" content="历届 · 小草颂 LGM">
<meta property="og:image" content="assets/img/logo.png">
<link rel="icon" href="assets/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=202611271408">
</head>
<body>
<header id="site-header" class="site-header"></header>

<main>
  <section class="wrap hero" style="padding-bottom:30px">
    <p class="page-giant">HISTORY<span style="color:var(--ink);text-shadow:none">.</span></p>
    <p class="lead" data-i18n="hi.lead"></p>
  </section>

  <!-- 大事记：左 = 音乐会，右 = 得奖与成就 -->
  <section class="wrap block">
    <div class="tl2-head"><span data-i18n="hi.left"></span><span></span><span data-i18n="hi.right"></span></div>
    <div class="tl2" id="tl2"></div>
  </section>

  <!-- 历届小草：每个名字是一株草（members 分页） -->
  <div class="stage-band hidden" id="grass-block">
    <section class="wrap">
      <div class="stage-kicker">SINCE 2000</div>
      <h2 class="stage-title" data-i18n="hi.grass"></h2>
      <p class="stage-sub" id="grass-sub"></p>
      <div class="grass-tools">
        <input class="name-search" id="grass-search" type="search" autocomplete="off">
        <span class="grass-now" id="grass-now" aria-live="polite"></span>
      </div>
    </section>
    <div class="gf-scroll" id="gf-scroll"><div class="gf" id="grass" role="img"></div></div>
    <section class="wrap">
      <p class="gf-hint" id="gf-hint"></p>
      <details class="stage-list"><summary data-i18n="ab.byTerm"></summary><div id="grass-list"></div></details>
    </section>
  </div>
</main>

<footer id="site-footer" class="site-footer"></footer>

<script src="assets/js/history.js?v=202611271408"></script>
</body>
</html>
