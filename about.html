<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>关于我们 · 小草颂 LGM</title>
<meta name="description" content="小草颂 LGM（LitleGras Music Club）——理大工程系分院原创音乐团体，成立于 2000 年。">
<meta property="og:title" content="关于我们 · 小草颂 LGM">
<meta property="og:image" content="assets/img/logo.png">
<link rel="icon" href="assets/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&family=Archivo+Black&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=202611270843">
</head>
<body>
<header id="site-header" class="site-header"></header>

<main>
  <section class="wrap hero" style="padding-bottom:48px">
    <p class="page-giant">ABOUT<span style="color:var(--ink);text-shadow:none">.</span></p>
    <div class="hero-grid">
      <div class="hero-main">
        <p class="lead" data-i18n="ab.title"></p>
        <p id="about" style="font-size:18px;line-height:1.9;max-width:640px"></p>
      </div>
      <div class="hero-side" style="min-height:320px">
        <div class="pasted" style="background:#fff;display:flex;align-items:center;justify-content:center"><img src="assets/img/logo.png" alt="小草颂 LGM logo" style="width:80%;height:auto;object-fit:contain"></div>
        <div class="tape"></div>
      </div>
    </div>
  </section>

  <section class="dark">
    <div class="wrap block">
      <div class="grid" style="--min:300px;gap:40px">
        <div><h2 class="display" style="color:var(--yellow);margin:0 0 14px;font-weight:400" data-i18n="ab.mission"></h2><p id="mission" style="font-size:18px;line-height:1.8;margin:0"></p></div>
        <div><h2 class="display" style="color:var(--pink);margin:0 0 14px;font-weight:400" data-i18n="ab.vision"></h2><ul class="list" id="vision"></ul></div>
      </div>
    </div>
  </section>

  <section class="wrap block">
    <div class="sec-title"><h2 data-i18n="ab.acts"></h2><a href="events.html" style="font-weight:900" data-i18n="btn.allEvents"></a></div>
    <div class="grid tilt" id="acts" style="--min:220px"></div>
  </section>

  <section class="wrap block">
    <div class="sec-title"><h2 data-i18n="ab.history"></h2></div>
    <div class="timeline" id="history"></div>
  </section>

  <section class="wrap block" id="team-block">
    <div class="sec-title"><h2 data-i18n="ab.team"></h2><a id="team-link" style="font-weight:900"></a></div>
    <div class="team-photo" id="team-photo"></div>
    <div class="team" id="team"></div>
  </section>

  <!-- 舞台区：梦开始的地方（members）+ 乐捐（donors） -->
  <div class="stage-band" id="stage">
    <section class="wrap hidden" id="dream-block">
      <div class="stage-kicker" data-i18n="ab.dreamKicker"></div>
      <h2 class="stage-title" data-i18n="ab.dream"></h2>
      <p class="stage-sub" id="dream-sub"></p>
      <input class="name-search" id="name-search" type="search" autocomplete="off">
      <div class="na" id="name-art" role="img"></div>
      <details class="stage-list"><summary data-i18n="ab.byTerm"></summary><div id="name-list"></div></details>
    </section>

    <section class="wrap" id="donors">
      <div class="stage-kicker" id="donor-kicker"></div>
      <h2 class="stage-title" data-i18n="ab.donors"></h2>
      <div class="donor-head">
        <p class="stage-sub" id="donor-sub"></p>
        <div class="donor-pct hidden" id="donor-pct"></div>
      </div>
      <div class="na" id="donor-art" role="img"></div>
      <div id="donor-empty"></div>
      <details class="stage-list hidden" id="donor-list-wrap"><summary data-i18n="ab.allDonors"></summary><div id="donor-list"></div></details>
    </section>
  </div>

  <section class="wrap block" style="padding-bottom:100px">
    <div class="panel blue">
      <div style="flex:1 1 420px"><div class="big brush" style="font-family:var(--brush)" data-i18n="ab.join"></div><p style="font-weight:700;font-size:18px;margin:14px 0 0" data-i18n="ab.joinBody"></p></div>
      <div id="join"></div>
    </div>
  </section>
</main>

<footer id="site-footer" class="site-footer"></footer>

<script src="assets/js/config.js?v=202611270843"></script>
<script src="assets/js/lgm.js?v=202611270843"></script>
<script src="assets/js/strings.js?v=202611270843"></script>
<script src="assets/js/nameart.js?v=202611270843"></script>
<script src="assets/js/about.js?v=202611270843"></script>
</body>
</html>
